openapi: 3.0.3
info:
  title: Hybrid Social — Coordination API
  version: 1.0.0
  description: |
    Central coordination server for the hybrid Web2/Web3 social network.
    **This API stores metadata + content hashes (CIDs) only — media bytes never
    transit this server.** Clients compress media locally, upload it directly to
    the P2P network / pinning provider, then announce the resulting CID here.

    ### Realtime (WebSocket)
    `GET /v1/ws` upgrades to a WebSocket. First frame MUST be
    `{"v":1,"type":"auth","data":{"token":"<access JWT>"}}` (5 s budget).
    Envelope: `{"v":1,"type":string,"data":object}`.

    | type | direction | data |
    |---|---|---|
    | auth / auth.ok / auth.err | c→s / s→c | {token} / {user_id} / {error} |
    | dm.new | both | client: {to_user_id?|thread_id?, body, media_cid?} · server: DmMessage |
    | dm.ack | s→c | DmMessage (echo to sender) |
    | dm.read | both | {thread_id, upto_id, by?} |
    | notif | s→c | {kind, actor_id, post_id, created_at} |
    | live.start / live.end | s→c | {stream_id, host_id?, title?} |
    | live.join / live.leave | c→s | {stream_id} |
    | live.joined | s→c | {stream_id} |
    | live.chunk | both | {stream_id, seq, cid, duration_ms} (host announces → room fan-out) |
    | ping / pong | both | {} |

    Clients close the socket (code 1000, reason "bg") the moment they enter
    background; missed events are re-fetched over REST on resume.
  contact:
    name: Engineering
servers:
  - url: http://localhost:8080
    description: local dev
  - url: https://{app}.fly.dev
    description: Fly.io deployment
    variables:
      app:
        default: hybrid-social-backend
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: users
  - name: feed
  - name: posts
  - name: stories
  - name: dm
  - name: live
  - name: media
  - name: notifications
  - name: seo
  - name: system

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness + DB read check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }

  /s/{postId}:
    get:
      tags: [seo]
      summary: Share link (SEO interceptor)
      description: |
        Crawler User-Agents receive minimal HTML with og: meta resolved through
        public IPFS gateways; human User-Agents receive a 307 redirect to the
        web app deep link. No cloaking — same content, minus the app shell.
      security: []
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "og: HTML (crawlers)", content: { text/html: { schema: { type: string } } } }
        "307": { description: Redirect to web deep link (humans) }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Email + password registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email: { type: string, format: email }
                username: { type: string, pattern: "^[a-z0-9._]{3,30}$" }
                password: { type: string, minLength: 8 }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: email or username taken, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /v1/auth/login:
    post:
      tags: [auth, totp]
      summary: Email + password login (returns token pair OR a 2FA pending token)
      description: |
        If the account has 2FA enabled the response is `{ requires_2fa, pending_token, user_id }`
        and no access token is issued. The client then calls `POST /v1/auth/2fa` with the
        pending token and a 6-digit TOTP code (or a backup code) to receive the real pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: token pair OR 2FA challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/google:
    post:
      tags: [auth]
      summary: Google id_token sign-in (verified against Google JWKS)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: GOOGLE_CLIENT_ID not configured }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token (single-use) and mint a new pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: revoked, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }

  /v1/auth/2fa:
    post:
      tags: [auth, totp]
      summary: Exchange a 2FA pending token + (TOTP code | backup code) for the real token pair
      description: |
        Called only when /v1/auth/login returned `{ requires_2fa: true, pending_token }`.
        The pending token is a JWT with sub `2fa:pending:<uid>` and 10-minute TTL;
        it cannot be used as a regular access token (the AuthUser extractor rejects it).
        A consumed backup code is single-use; a wrong TOTP returns 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pending_token, code]
              properties:
                pending_token: { type: string, description: "From /v1/auth/login when 2FA is on" }
                code: { type: string, description: "6-digit TOTP code OR XXXXX-XXXXX backup code" }
      responses:
        "200":
          description: full token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/users/me:
    get:
      tags: [users]
      summary: Own profile
      responses:
        "200": { $ref: "#/components/responses/Profile" }

  /v1/users/me/2fa:
    get:
      tags: [users, totp]
      summary: 2FA status (TOTP enabled, verified-at, backup codes remaining)
      responses:
        "200":
          description: status
          content:
            application/json:
              schema:
                type: object
                properties:
                  totp_enabled: { type: boolean }
                  verified_at: { type: integer, nullable: true, description: "epoch seconds; null until the user confirms" }
                  backup_codes_remaining: { type: integer }

  /v1/users/me/2fa/enable:
    post:
      tags: [users, totp]
      summary: Begin 2FA setup (returns secret + otpauth URI + 10 backup codes; totp_enabled stays false until confirm)
      responses:
        "200":
          description: setup bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: "base32 (no padding) — type into your TOTP app" }
                  otpauth_uri: { type: string, description: "otpauth:// URI; QR codes encode this" }
                  backup_codes:
                    type: array
                    items: { type: string, example: "ABCDE-FGHJK" }
                    minItems: 10
                    maxItems: 10

  /v1/users/me/2fa/confirm:
    post:
      tags: [users, totp]
      summary: Verify the first 6-digit code from your TOTP app and activate 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        "200": { description: enabled, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, totp_enabled: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/users/me/2fa/disable:
    post:
      tags: [users, totp]
      summary: Disable 2FA (requires the current password AND a fresh TOTP or backup code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string, format: password }
                code: { type: string, description: "6-digit TOTP code OR a backup code" }
      responses:
        "200": { description: disabled, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, totp_enabled: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [users]
      summary: Edit profile (CID-only avatar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 80 }
                bio: { type: string, maxLength: 500 }
                avatar_cid: { type: string }
                is_private: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/users/me/privacy:
    patch:
      tags: [users, privacy]
      summary: Update private-account / activity-status / mentions / replies flags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_private: { type: boolean }
                show_activity: { type: boolean }
                allow_mentions: { type: boolean }
                allow_story_replies: { type: boolean }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  is_private: { type: boolean }
                  show_activity: { type: boolean }
                  allow_mentions: { type: boolean }
                  allow_story_replies: { type: boolean }

  /v1/users/me/notification-prefs:
    post:
      tags: [users, notifications]
      summary: Update per-kind push preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pause_all: { type: boolean, description: "Master switch — disables all push" }
                posts: { type: boolean, description: "Likes, comments, follows, mentions, tags" }
                stories: { type: boolean, description: "Story + story-reply notifications" }
                lives: { type: boolean, description: "Live-start notifications" }
                dms: { type: boolean, description: "Direct messages" }
                calls: { type: boolean, description: "Video / voice call events" }
      responses:
        "200": { description: stored, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }

  /v1/users/{username}:
    get:
      tags: [users]
      summary: Public profile (anonymous allowed — SSR/SEO path)
      security: []
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Profile" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{username}/posts:
    get:
      tags: [users]
      summary: Profile grid (keyset). Private accounts return locked=true for non-followers.
      security: []
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: grid page
          content:
            application/json:
              schema:
                type: object
                properties:
                  locked: { type: boolean }
                  items: { type: array, items: { $ref: "#/components/schemas/Post" } }
                  next_cursor: { type: string, nullable: true }

  /v1/users/{id}/follow:
    put:
      tags: [users]
      summary: Follow a user
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: following, content: { application/json: { schema: { type: object, properties: { following: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: Unfollow a user
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: unfollowed, content: { application/json: { schema: { type: object, properties: { following: { type: boolean } } } } } }

  /v1/feed:
    get:
      tags: [feed]
      summary: Home feed (followed authors + self, keyset pagination)
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { $ref: "#/components/responses/PostPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/reels:
    get:
      tags: [feed]
      summary: Global vertical-video feed (kind=reel, public accounts)
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { $ref: "#/components/responses/PostPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/posts:
    post:
      tags: [posts]
      summary: Create a post by announcing its media CID
      description: Media is already on the P2P network; this records metadata and enqueues a pin job (durability floor).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, media_cid]
              properties:
                kind: { type: string, enum: [image, video, reel] }
                media_cid: { type: string }
                thumb_cid: { type: string }
                width: { type: integer }
                height: { type: integer }
                duration_ms: { type: integer }
                caption: { type: string, maxLength: 2200 }
      responses:
        "200": { $ref: "#/components/responses/PostResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/posts/{id}:
    get:
      tags: [posts]
      summary: Read a post (anonymous allowed — SSR/SEO path)
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/PostResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [posts]
      summary: Soft-delete own post
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: deleted, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/posts/{id}/like:
    put:
      tags: [posts]
      summary: Like (idempotent; counter is write-batched)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: liked, content: { application/json: { schema: { type: object, properties: { liked: { type: boolean } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [posts]
      summary: Unlike
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: unliked, content: { application/json: { schema: { type: object, properties: { liked: { type: boolean } } } } } }

  /v1/posts/{id}/comments:
    get:
      tags: [posts]
      summary: List comments (anonymous allowed, keyset)
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: comment page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
                  next_cursor: { type: string, nullable: true }
    post:
      tags: [posts]
      summary: Comment on a post
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  post_id: { type: string }
                  body: { type: string }
                  created_at: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/stories:
    post:
      tags: [stories]
      summary: Publish a 24 h story (hard-deleted by the TTL sweeper)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_cid]
              properties:
                media_cid: { type: string }
                thumb_cid: { type: string }
                ttl_secs: { type: integer, description: "test hook; clamped to 24 h" }
      responses:
        "200":
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  media_cid: { type: string }
                  thumb_cid: { type: string, nullable: true }
                  created_at: { type: integer, format: int64 }
                  expires_at: { type: integer, format: int64 }

  /v1/stories/feed:
    get:
      tags: [stories]
      summary: Active stories from followed users + self
      responses:
        "200":
          description: stories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Story" } }

  /v1/dm/threads:
    get:
      tags: [dm]
      summary: Thread list with peers, previews and unread counts
      responses:
        "200":
          description: threads
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DmThread" } }
    post:
      tags: [dm]
      summary: Get-or-create the 1:1 thread with a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
      responses:
        "200":
          description: thread
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  peer_id: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/dm/threads/{id}/messages:
    get:
      tags: [dm]
      summary: Message history (keyset, newest first)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DmMessage" } }
                  next_cursor: { type: string, nullable: true }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [dm]
      summary: Send a message (text, image, or voice)
      description: |
        `kind` defaults to `text`. For `image|video|reel` messages `media_cid` is
        required and `thumb_cid/width/height` are recommended. For `voice` messages
        `duration_ms` (1..=600000) and a `waveform` JSON array of small integer
        samples (≤200) are required — the waveform lets the receiver render a
        scrubber without decoding audio. The recipient also receives the
        message over WS as `dm.new`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 4000 }
                media_cid: { type: string, description: "IPFS CID; required for non-text kinds" }
                kind: { type: string, enum: [text, image, voice, video, reel], default: text }
                duration_ms: { type: integer, minimum: 1, maximum: 600000, description: "Voice only" }
                waveform:
                  type: string
                  description: "JSON-encoded array of i16 amplitude samples (≤200 entries); voice only"
                  example: "[0,12,34,56,80,90,80,56,34,12,0]"
                thumb_cid: { type: string, description: "Image/video poster (recommended)" }
                width: { type: integer, description: "Image/video intrinsic width" }
                height: { type: integer, description: "Image/video intrinsic height" }
      responses:
        "200": { description: sent, content: { application/json: { schema: { $ref: "#/components/schemas/DmMessage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/dm/threads/{id}/read:
    post:
      tags: [dm]
      summary: Mark messages read up to an id (peer gets dm.read over WS)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upto_id]
              properties:
                upto_id: { type: string }
      responses:
        "200": { description: count marked, content: { application/json: { schema: { type: object, properties: { read: { type: integer } } } } } }

  /v1/live:
    post:
      tags: [live]
      summary: Start a live stream (online followers get live.start over WS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 120 }
      responses:
        "200":
          description: stream created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveStream" }

  /v1/live/{id}:
    get:
      tags: [live]
      summary: Stream metadata + full chunk playlist (late-join catch-up / VOD)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: stream + playlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream: { $ref: "#/components/schemas/LiveStream" }
                  chunks: { type: array, items: { $ref: "#/components/schemas/LiveChunk" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/live/{id}/chunk:
    post:
      tags: [live]
      summary: Announce a 3 s chunk CID (host only; REST fallback for WS live.chunk)
      description: The FIRST chunk of a stream triggers an immediate pin job (durable origin for late joiners).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq, cid]
              properties:
                seq: { type: integer, minimum: 0 }
                cid: { type: string }
                duration_ms: { type: integer, default: 3000 }
      responses:
        "200": { description: accepted + fanned out, content: { application/json: { schema: { $ref: "#/components/schemas/LiveChunk" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/live/{id}/end:
    post:
      tags: [live]
      summary: End the stream (room receives live.end; room closes)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: ended, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/media/announce:
    post:
      tags: [media]
      summary: Announce a CID for pinning (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid]
              properties:
                cid: { type: string }
                kind: { type: string, maxLength: 32, default: media }
      responses:
        "200": { description: pin job state, content: { application/json: { schema: { $ref: "#/components/schemas/PinJob" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/media/pins/{cid}:
    get:
      tags: [media]
      summary: Pin job status for a CID
      parameters: [{ name: cid, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: pin job, content: { application/json: { schema: { $ref: "#/components/schemas/PinJob" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/media/upload-token:
    get:
      tags: [media]
      summary: Scoped upload credential for browser/device→provider direct uploads
      responses:
        "200":
          description: credential
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, example: pinata }
                  endpoint: { type: string, example: "https://api.pinata.cloud/pinning/pinFileToIPFS" }
                  jwt: { type: string }
        "503": { description: PINATA_UPLOAD_JWT not configured }

  /v1/notifications:
    get:
      tags: [notifications]
      summary: Activity feed (keyset)
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  next_cursor: { type: string, nullable: true }

  /v1/push/register:
    post:
      tags: [notifications]
      summary: Register a push token (FCM/APNs) for background delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: { type: string, enum: [android, ios, web] }
                token: { type: string, maxLength: 4096 }
      responses:
        "200": { description: stored, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }

  /v1/push/unregister:
    post:
      tags: [notifications]
      summary: Drop a push token (called on logout so the server doesn't keep ghosting notifications)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: dropped, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }

  /v1/search/users:
    get:
      tags: [feed]
      summary: User search (username/display_name substring, min 2 chars)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 64 } }
      responses:
        "200":
          description: matches ordered by followers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/Author" }
                        - type: object
                          properties:
                            followers: { type: integer }

  /v1/explore:
    get:
      tags: [feed]
      summary: Explore grid — recent posts from public accounts (keyset)
      security: []
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { $ref: "#/components/responses/PostPage" }

  /v1/me/saved:
    get:
      tags: [posts]
      summary: Bookmarked posts, most recently saved first
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { $ref: "#/components/responses/PostPage" }

  /v1/posts/{id}/save:
    put:
      tags: [posts]
      summary: Bookmark a post (idempotent)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: saved, content: { application/json: { schema: { type: object, properties: { saved: { type: boolean } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [posts]
      summary: Remove a bookmark
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: unsaved, content: { application/json: { schema: { type: object, properties: { saved: { type: boolean } } } } } }

  /v1/posts/{id}/report:
    post:
      tags: [posts]
      summary: Report a post (one per user per post — moderation inbox)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: reported, content: { application/json: { schema: { type: object, properties: { reported: { type: boolean } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/comments/{id}:
    delete:
      tags: [posts]
      summary: Delete a comment (comment author or post owner)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: deleted, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{username}/followers:
    get:
      tags: [users]
      summary: Follower list (keyset on follow time)
      security: []
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { $ref: "#/components/responses/FollowPage" }

  /v1/users/{username}/following:
    get:
      tags: [users]
      summary: Following list (keyset on follow time)
      security: []
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { $ref: "#/components/responses/FollowPage" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "JWT (HS256, 15 min TTL)"
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: "Keyset cursor `created_at,id` from the previous page's next_cursor"
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 50 }
  responses:
    TokenPair:
      description: Token pair (rotating refresh)
      content:
        application/json:
          schema:
            type: object
            properties:
              access_token: { type: string }
              refresh_token: { type: string }
              token_type: { type: string, example: Bearer }
              expires_in: { type: integer, example: 900 }
              user_id: { type: string }
    Profile:
      description: User profile
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Profile" }
    PostResponse:
      description: Post
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Post" }
    FollowPage:
      description: Page of follow-graph entries
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  allOf:
                    - { $ref: "#/components/schemas/Author" }
                    - type: object
                      properties:
                        followed_at: { type: integer, format: int64 }
                        is_following: { type: boolean, description: viewer→entry edge }
              next_cursor: { type: string, nullable: true }
    PostPage:
      description: Page of posts
      content:
        application/json:
          schema:
            type: object
            properties:
              items: { type: array, items: { $ref: "#/components/schemas/Post" } }
              next_cursor: { type: string, nullable: true }
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Author:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string, nullable: true }
        avatar_cid: { type: string, nullable: true }
    Post:
      type: object
      properties:
        id: { type: string, description: ULID }
        author: { $ref: "#/components/schemas/Author" }
        kind: { type: string, enum: [image, video, reel] }
        media_cid: { type: string, description: "IPFS CID — resolve via any gateway" }
        thumb_cid: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        caption: { type: string }
        like_count: { type: integer }
        comment_count: { type: integer }
        created_at: { type: integer, format: int64, description: unix seconds }
        liked_by_me: { type: boolean }
    Profile:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string, nullable: true }
        bio: { type: string }
        avatar_cid: { type: string, nullable: true }
        is_private: { type: boolean }
        created_at: { type: integer, format: int64 }
        counts:
          type: object
          properties:
            posts: { type: integer }
            followers: { type: integer }
            following: { type: integer }
        is_following: { type: boolean }
        is_me: { type: boolean }
    Comment:
      type: object
      properties:
        id: { type: string }
        body: { type: string }
        created_at: { type: integer, format: int64 }
        author: { $ref: "#/components/schemas/Author" }
    Story:
      type: object
      properties:
        id: { type: string }
        media_cid: { type: string }
        thumb_cid: { type: string, nullable: true }
        created_at: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64 }
        author: { $ref: "#/components/schemas/Author" }
    DmThread:
      type: object
      properties:
        id: { type: string }
        peer: { $ref: "#/components/schemas/Author" }
        last_message: { type: string, nullable: true }
        last_message_at: { type: integer, format: int64, nullable: true }
        unread: { type: integer }
    DmMessage:
      type: object
      properties:
        id: { type: string }
        thread_id: { type: string }
        sender_id: { type: string }
        body: { type: string }
        media_cid: { type: string, nullable: true }
        created_at: { type: integer, format: int64 }
        read_at: { type: integer, format: int64, nullable: true }
        kind: { type: string, enum: [text, image, voice, video, reel], default: text }
        duration_ms: { type: integer, nullable: true, description: "Voice only; epoch milliseconds" }
        waveform: { type: string, nullable: true, description: "Voice only; JSON array of i16 samples" }
        thumb_cid: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
    TokenPair:
      type: object
      description: Returned by /v1/auth/{register,login,2fa,refresh}
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: access-token TTL in seconds }
        user_id: { type: string }
    LoginResponse:
      oneOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          description: "Account has 2FA on — caller must POST /v1/auth/2fa to complete"
          properties:
            requires_2fa: { type: boolean, enum: [true] }
            pending_token: { type: string }
            user_id: { type: string }
    LiveStream:
      type: object
      properties:
        id: { type: string }
        host_id: { type: string }
        title: { type: string }
        status: { type: string, enum: [live, ended] }
        started_at: { type: integer, format: int64 }
        ended_at: { type: integer, format: int64, nullable: true }
        host: { $ref: "#/components/schemas/Author" }
    LiveChunk:
      type: object
      properties:
        stream_id: { type: string }
        seq: { type: integer }
        cid: { type: string }
        duration_ms: { type: integer }
    PinJob:
      type: object
      properties:
        cid: { type: string }
        kind: { type: string }
        status: { type: string, enum: [pending, pinned, failed] }
        attempts: { type: integer }
        created_at: { type: integer, format: int64 }
        pinned_at: { type: integer, format: int64, nullable: true }
    Notification:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [like, comment, follow] }
        post_id: { type: string, nullable: true }
        created_at: { type: integer, format: int64 }
        read_at: { type: integer, format: int64, nullable: true }
        actor: { $ref: "#/components/schemas/Author" }
